version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: doomsday-docai-backend
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - LLM_MODEL=${LLM_MODEL:-gemini-1.5-flash}
      - EMBEDDING_MODEL=all-MiniLM-L6-v2
      - RETRIEVAL_TOP_K=10
      - RERANK_TOP_K=5
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: doomsday-docai-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

